<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JP Cabinet PRO — Edit Dimensions</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div id="app" class="panel">
    <header>
      <h1 data-i18n="edit_dimensions">Edit Dimensions</h1>
      <div class="lang-toggle">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="sq">SQ</button>
      </div>
    </header>
    <form id="dim-form">
      <label>Width (mm)<input name="width_mm" type="number" step="0.1" min="1" value="800" required></label>
      <label>Height (mm)<input name="height_mm" type="number" step="0.1" min="1" value="720" required></label>
      <label>Depth (mm)<input name="depth_mm" type="number" step="0.1" min="1" value="560" required></label>
      <label>Panel thickness (mm)<input name="panel_thickness_mm" type="number" step="0.1" min="1" value="18" required></label>
      <label>Custom thickness (mm)<input name="custom_thickness_mm" type="number" step="0.1" min="0"></label>
      <label>Shelf count<input name="shelf_count" type="number" step="1" min="0" value="1" required></label>
      <label>Top construction
        <select name="top_construction">
          <option value="top_between_sides" selected>Top between sides</option>
          <option value="top_over_sides">Top over sides</option>
        </select>
      </label>
      <label>Bottom construction
        <select name="bottom_construction">
          <option value="bottom_between_sides" selected>Bottom between sides</option>
          <option value="bottom_under_sides">Bottom under sides</option>
        </select>
      </label>
      <label>Back mounting type
        <select name="back_mount_type">
          <option value="full_back">Full back</option>
          <option value="recessed_back" selected>Recessed back</option>
          <option value="grooved_back">Grooved back</option>
          <option value="surface_mounted_back">Surface-mounted back</option>
        </select>
      </label>
      <label>Groove depth (mm)<input name="groove_depth_mm" type="number" step="0.1" min="0" value="8"></label>
      <label>Rear inset (mm)<input name="rear_inset_mm" type="number" step="0.1" min="0" value="10"></label>
      <fieldset class="calculated">
        <legend>Calculated internal dimensions (prototype)</legend>
        <div id="internal-dims">—</div>
      </fieldset>
      <div id="preview-summary" class="preview">No preview yet.</div>
      <div class="actions">
        <button type="button" id="btn-preview">Preview</button>
        <button type="button" id="btn-apply">Apply</button>
        <button type="button" id="btn-cancel">Cancel</button>
      </div>
      <div id="errors" class="errors" aria-live="polite"></div>
    </form>
  </div>
  <script src="../js/bridge.js"></script>
  <script src="../js/dimensions.js"></script>
</body>
</html>
